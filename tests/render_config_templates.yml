---
- name: Render static config templates for vps-a
  hosts: vps-a.example.com
  gather_facts: false
  connection: local
  vars:
    render_dir: "{{ lookup('env', 'TEST_RENDER_DIR') }}"
    repo_root: "{{ playbook_dir }}/.."
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    config_templates:
      - src: "{{ repo_root }}/roles/base/docker_setup/templates/daemon.json.j2"
        dest: json/docker-daemon.json
      - src: "{{ repo_root }}/roles/apps/v2ray/templates/config.json.j2"
        dest: json/v2ray-config.json
      - src: "{{ repo_root }}/roles/apps/xray/templates/config.json.j2"
        dest: json/xray-config.json
      - src: "{{ repo_root }}/roles/gateway/caddy/templates/docker-compose.yml.j2"
        dest: compose/caddy.yml
      - src: "{{ repo_root }}/roles/apps/v2ray/templates/docker-compose.yml.j2"
        dest: compose/v2ray.yml
      - src: "{{ repo_root }}/roles/apps/xray/templates/docker-compose.yml.j2"
        dest: compose/xray.yml
      - src: "{{ repo_root }}/roles/apps/neo_backend/templates/docker-compose.yml.j2"
        dest: compose/neo_backend.yml
  tasks:
    - name: Ensure TEST_RENDER_DIR was provided
      ansible.builtin.assert:
        that:
          - render_dir | length > 0

    - name: Create render directories
      ansible.builtin.file:
        path: "{{ render_dir }}/{{ item }}"
        state: directory
        mode: "0700"
      loop:
        - json
        - compose

    - name: Render config templates
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ render_dir }}/{{ item.dest }}"
        mode: "0600"
      loop: "{{ config_templates }}"

- name: Render static config templates for vps-b
  hosts: vps-b.example.com
  gather_facts: false
  connection: local
  vars:
    render_dir: "{{ lookup('env', 'TEST_RENDER_DIR') }}"
    repo_root: "{{ playbook_dir }}/.."
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    config_templates:
      - src: "{{ repo_root }}/roles/apps/postgres/templates/docker-compose.yml.j2"
        dest: compose/postgres.yml
      - src: "{{ repo_root }}/roles/apps/zammad/templates/docker-compose.yml.j2"
        dest: compose/zammad.yml
      - src: "{{ repo_root }}/roles/apps/cloudflared/templates/docker-compose.yml.j2"
        dest: compose/cloudflared.yml
  tasks:
    - name: Ensure TEST_RENDER_DIR was provided
      ansible.builtin.assert:
        that:
          - render_dir | length > 0

    - name: Create compose render directory
      ansible.builtin.file:
        path: "{{ render_dir }}/compose"
        state: directory
        mode: "0700"

    - name: Render config templates
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ render_dir }}/{{ item.dest }}"
        mode: "0600"
      loop: "{{ config_templates }}"
