---
- name: 创建 Cloudflared 工作目录
  file:
    path: "{{ cloudflared_project_dir }}"
    state: directory
    owner: "{{ cloudflared_owner }}"
    group: "{{ cloudflared_group }}"
    mode: '0755'

- name: 确保外部网络 web-proxy 存在
  community.docker.docker_network:
    name: web-proxy
    state: present
  when: cloudflared_manage_runtime | bool

- name: 下发 Cloudflared Docker Compose 文件
  template:
    src: docker-compose.yml.j2
    dest: "{{ cloudflared_project_dir }}/docker-compose.yml"
    owner: "{{ cloudflared_owner }}"
    group: "{{ cloudflared_group }}"
    mode: '0600'
  notify: Restart Cloudflared
  no_log: true

- name: 启动 Cloudflared 容器
  community.docker.docker_compose_v2:
    project_src: "{{ cloudflared_project_dir }}"
    state: present
    pull: missing
  when: cloudflared_manage_runtime | bool
