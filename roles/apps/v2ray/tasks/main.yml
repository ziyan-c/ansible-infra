---
- name: 校验 Proxy Control Plane runtime API 绑定地址 (V2Ray)
  ansible.builtin.assert:
    that:
      - proxy_control_plane_runtime_api_host | default('') | length > 0
    fail_msg: >-
      Set proxy_control_plane_runtime_api_host to this host's WireGuard IP
      before enabling proxy_control_plane_runtime_api_enabled.
  when: proxy_control_plane_runtime_api_enabled | default(false) | bool

- name: 创建 V2ray 工作目录
  file:
    path: "{{ v2ray_project_dir }}"
    state: directory
    owner: "{{ v2ray_owner }}"
    group: "{{ v2ray_group }}"
    mode: '0755'

- name: 确保外部网络 web-proxy 存在
  community.docker.docker_network:
    name: web-proxy
    state: present
  when: v2ray_manage_runtime | bool

- name: 下发 V2ray 配置文件 (config.json)
  template:
    src: config.json.j2
    dest: "{{ v2ray_project_dir }}/config.json"
    owner: "{{ v2ray_owner }}"
    group: "{{ v2ray_group }}"
    mode: '0644'
  notify: Restart V2ray
  no_log: true

- name: 下发 V2ray Docker Compose 文件
  template:
    src: docker-compose.yml.j2
    dest: "{{ v2ray_project_dir }}/docker-compose.yml"
    owner: "{{ v2ray_owner }}"
    group: "{{ v2ray_group }}"
    mode: '0644'
  notify: Restart V2ray

- name: 启动 V2ray 容器
  community.docker.docker_compose_v2:
    project_src: "{{ v2ray_project_dir }}"
    state: present
  when: v2ray_manage_runtime | bool
