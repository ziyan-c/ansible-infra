---
- name: Converge Xray under Caddy role
  hosts: localhost
  gather_facts: false
  vars:
    xray_under_caddy_project_dir: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/xray-under-caddy"
    xray_under_caddy_owner: "{{ lookup('pipe', 'id -un') }}"
    xray_under_caddy_group: "{{ lookup('pipe', 'id -gn') }}"
    xray_under_caddy_manage_runtime: false
    xray_under_caddy_image: "ghcr.io/xtls/xray-core:test"
    xray_under_caddy_client_id: "00000000-0000-0000-0000-000000000000"
  roles:
    - role: apps/xray_under_caddy
