---
- name: 校验 Proxy Control Plane 部署配置
  ansible.builtin.assert:
    that:
      - proxy_control_plane_image | length > 0
      - proxy_control_plane_env_file_src | length > 0
    fail_msg: >-
      Set proxy_control_plane_image and proxy_control_plane_env_file_src.
  no_log: true

- name: 登录 GitHub Container Registry
  community.docker.docker_login:
    registry_url: ghcr.io
    username: "{{ proxy_control_plane_ghcr_username }}"
    password: "{{ proxy_control_plane_ghcr_token }}"
  no_log: true
  when:
    - proxy_control_plane_ghcr_username | length > 0
    - proxy_control_plane_ghcr_token | length > 0

- name: 创建 Proxy Control Plane 工作目录
  ansible.builtin.file:
    path: "{{ proxy_control_plane_project_dir }}"
    state: directory
    owner: "{{ proxy_control_plane_owner }}"
    group: "{{ proxy_control_plane_group }}"
    mode: "0700"

- name: 复制 Proxy Control Plane 环境变量文件
  ansible.builtin.copy:
    src: "{{ proxy_control_plane_env_file_src }}"
    dest: "{{ proxy_control_plane_env_file_dest }}"
    owner: "{{ proxy_control_plane_owner }}"
    group: "{{ proxy_control_plane_group }}"
    mode: "0600"
  no_log: true
  notify: Restart Proxy Control Plane

- name: 下发 Proxy Control Plane Docker Compose 文件
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ proxy_control_plane_project_dir }}/docker-compose.yml"
    owner: "{{ proxy_control_plane_owner }}"
    group: "{{ proxy_control_plane_group }}"
    mode: "0644"
  notify: Restart Proxy Control Plane

- name: 拉取 Proxy Control Plane 镜像
  ansible.builtin.command:
    cmd: docker compose pull api
    chdir: "{{ proxy_control_plane_project_dir }}"
  register: proxy_control_plane_pull_result
  changed_when: "'Downloaded newer image' in (proxy_control_plane_pull_result.stdout ~ proxy_control_plane_pull_result.stderr)"
  when:
    - proxy_control_plane_manage_runtime | bool

- name: 执行 Proxy Control Plane 数据库迁移
  ansible.builtin.command:
    cmd: >-
      docker compose run --rm api
      /app/proxy-control-plane db migrate --no-local-config
    chdir: "{{ proxy_control_plane_project_dir }}"
  register: proxy_control_plane_migrate_result
  changed_when: "'applied SQL migration' in (proxy_control_plane_migrate_result.stdout ~ proxy_control_plane_migrate_result.stderr)"
  when:
    - proxy_control_plane_manage_runtime | bool
    - proxy_control_plane_run_migrations | bool

- name: 启动 Proxy Control Plane 容器
  community.docker.docker_compose_v2:
    project_src: "{{ proxy_control_plane_project_dir }}"
    state: present
    pull: always
  when: proxy_control_plane_manage_runtime | bool
