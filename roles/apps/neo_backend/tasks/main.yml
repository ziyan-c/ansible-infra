---
- name: 创建 Neo-Backend 工作目录
  ansible.builtin.file:
    path: "{{ neo_backend_project_dir }}"
    state: directory
    owner: "{{ neo_backend_owner }}"
    group: "{{ neo_backend_group }}"
    mode: '0755'

- name: 校验 Neo-Backend 必需配置
  ansible.builtin.assert:
    that:
      - neo_proxy_password_allow_empty | bool or neo_proxy_password | length > 0
      - not (neo_manage_ssh_tunnel | bool) or neo_ssh_host | length > 0
      - >
        not (neo_backend_publish_wireguard | bool) or
        neo_backend_wireguard_bind_ip | length > 0 or
        (wg_servers.values() | selectattr('hostname', 'equalto', inventory_hostname) | list | length > 0)
    fail_msg: >-
      Neo Backend 需要 neo_proxy_password；如果启用 SSH tunnel，还需要
      neo_ssh_host。如果发布到 WireGuard 内网，还需要当前主机存在于
      wg_servers，或显式设置 neo_backend_wireguard_bind_ip。测试或临时环境可显式设置
      neo_proxy_password_allow_empty。
  no_log: true

- name: 下发 Neo-Backend 应用源码
  ansible.builtin.copy:
    src: app/
    dest: "{{ neo_backend_project_dir }}/app/"
    owner: "{{ neo_backend_owner }}"
    group: "{{ neo_backend_group }}"
    mode: preserve
  register: neo_backend_app_source
  notify: Restart Neo-Backend

- name: 确保外部网络 web-proxy 存在
  community.docker.docker_network:
    name: web-proxy
    state: present
  when: neo_backend_manage_runtime | bool

- name: 下发 Neo-Backend Docker Compose 文件
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ neo_backend_project_dir }}/docker-compose.yml"
    owner: "{{ neo_backend_owner }}"
    group: "{{ neo_backend_group }}"
    mode: '0600'
  register: neo_backend_compose_template
  notify: Restart Neo-Backend
  no_log: true

- name: 下发 Neo-Backend 环境变量文件
  ansible.builtin.template:
    src: neo-backend.env.j2
    dest: "{{ neo_backend_project_dir }}/.env"
    owner: "{{ neo_backend_owner }}"
    group: "{{ neo_backend_group }}"
    mode: '0600'
  notify: Restart Neo-Backend
  no_log: true

- name: 启动 Neo-Backend 容器
  community.docker.docker_compose_v2:
    project_src: "{{ neo_backend_project_dir }}"
    state: present
    build: "{{ 'always' if neo_backend_app_source.changed or neo_backend_compose_template.changed else 'policy' }}"
  when: neo_backend_manage_runtime | bool
