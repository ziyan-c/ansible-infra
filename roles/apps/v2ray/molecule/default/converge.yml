---
- name: Converge
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    v2ray_project_dir: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/v2ray"
    v2ray_owner: "{{ lookup('pipe', 'id -un') }}"
    v2ray_group: "{{ lookup('pipe', 'id -gn') }}"
    v2ray_manage_runtime: false
    v2ray_client_id: "00000000-0000-0000-0000-000000000000"
    v2ray_image: "v2fly/v2fly-core:test"
  tasks:
    - name: Apply V2ray role in template-only mode
      ansible.builtin.include_role:
        name: "{{ playbook_dir }}/../.."
