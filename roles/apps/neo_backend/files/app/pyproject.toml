[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neo-backend-temporary"
version = "0.1.0"
description = "Temporary Neo backend proxy with optional SSH tunnel to the 5090 compute node."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
neo-backend = "neo_backend.app:main"

[tool.setuptools.packages.find]
where = ["src"]
