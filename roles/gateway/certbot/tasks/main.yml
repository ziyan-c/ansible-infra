---
# ==========================================
# 1. 自动化 SSH 互信 (为了后续 Rsync 畅通无阻)
# ==========================================
# ==========================================
# 1. 自动化 SSH 互信 (为了后续 Rsync 畅通无阻)
# ==========================================
- name: 在网关主节点生成专用 SSH 密钥对 (用于证书分发)
  community.crypto.openssh_keypair:
    path: /root/.ssh/id_ed25519
    type: ed25519
    # 👇 添加这行备注，格式通常为：用户@主机名
    comment: "ansible-certbot-sync@{{ inventory_hostname }}"
  register: ssh_keypair

- name: 读取网关主节点的公钥
  slurp:
    src: /root/.ssh/id_ed25519.pub
  register: master_pub_key

- name: 将主节点的公钥授权给边缘节点 (免密 rsync)
  ansible.posix.authorized_key:
    user: root
    state: present
    key: "{{ master_pub_key.content | b64decode }}"
  delegate_to: "{{ item }}"
  loop: "{{ groups['edge_nodes'] }}"
  # 这个循环非常魔法：它会让主节点跨越去操作所有边缘节点

- name: 收集边缘节点 SSH 主机公钥
  command: "ssh-keyscan -T 10 -t ed25519 {{ item }}"
  register: edge_host_key_scans
  changed_when: false
  failed_when: edge_host_key_scans.rc != 0 or edge_host_key_scans.stdout | length == 0
  loop: "{{ groups['edge_nodes'] }}"

- name: 固定边缘节点 SSH 主机公钥到 cert master
  ansible.builtin.known_hosts:
    path: /root/.ssh/known_hosts
    name: "{{ item.item }}"
    key: "{{ item.stdout_lines | reject('match', '^#') | list | first }}"
  loop: "{{ edge_host_key_scans.results }}"

# ==========================================
# 2. 安装 Certbot 与 Cloudflare 插件
# ==========================================
- name: 安装 Certbot 及其 DNS 插件
  apt:
    name:
      - certbot
      - python3-certbot-dns-cloudflare
      - rsync
    state: present
    update_cache: yes

- name: 创建 Certbot 密钥存放目录
  file:
    path: /root/.secrets/certbot
    state: directory
    mode: '0700'

- name: 下发 Cloudflare API Token 配置
  template:
    src: cloudflare.ini.j2
    dest: /root/.secrets/certbot/cloudflare.ini
    mode: '0600'
  no_log: true

# ==========================================
# 3. 申请证书与自动化钩子
# ==========================================
- name: 检查泛域名证书是否已经存在
  stat:
    path: "/etc/letsencrypt/live/{{ base_domain }}/fullchain.pem"
  register: cert_check

- name: 首次申请泛域名证书 (如果不存在)
  command: >
    certbot certonly --dns-cloudflare
    --dns-cloudflare-credentials /root/.secrets/certbot/cloudflare.ini
    --email {{ certbot_email }} --agree-tos --non-interactive
    -d "{{ base_domain }}" -d "*.{{ base_domain }}"
  when: not cert_check.stat.exists

- name: 植入证书同步钩子 (续签成功时自动触发)
  template:
    src: sync_certs.sh.j2
    dest: /etc/letsencrypt/renewal-hooks/deploy/sync_certs.sh
    owner: root
    group: root
    mode: '0700'

- name: 检查边缘节点是否已存在证书
  ansible.builtin.stat:
    path: "{{ certbot_dest_dir }}/fullchain.pem"
  delegate_to: "{{ item }}"
  loop: "{{ groups['edge_nodes'] }}"
  register: edge_cert_status
  failed_when: false
  changed_when: false
  ignore_unreachable: true

- name: 提示边缘节点证书状态检查失败
  ansible.builtin.debug:
    msg: >-
      Skipping certificate-missing decision for edge nodes that could not be
      checked: {{
        edge_cert_status.results
        | default([])
        | selectattr('failed', 'defined')
        | selectattr('failed')
        | map(attribute='item')
        | list
      }}
  when: >
    edge_cert_status.results | default([])
    | selectattr('failed', 'defined')
    | selectattr('failed')
    | list
    | length > 0

- name: 提示边缘节点不可达
  ansible.builtin.debug:
    msg: >-
      Skipping certificate-missing decision for unreachable edge nodes: {{
        edge_cert_status.results
        | default([])
        | selectattr('unreachable', 'defined')
        | selectattr('unreachable')
        | map(attribute='item')
        | list
      }}
  when: >
    edge_cert_status.results | default([])
    | selectattr('unreachable', 'defined')
    | selectattr('unreachable')
    | list
    | length > 0

- name: 立即执行一次证书同步 (仅当主节点刚申请，或边缘节点确实丢失时触发)
  command: /etc/letsencrypt/renewal-hooks/deploy/sync_certs.sh
  when: >
    not cert_check.stat.exists or
    (
      edge_cert_status.results
      | default([])
      | selectattr('stat.exists', 'defined')
      | selectattr('stat.exists', 'equalto', false)
      | list
      | length > 0
    )
