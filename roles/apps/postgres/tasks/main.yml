---
- name: 创建 Postgres 工作与数据目录
  file:
    path: "{{ item }}"
    state: directory
    owner: 999  # 👈 对应 postgres 容器内用户的 UID，非常关键
    group: 999
    mode: '0750'
  loop:
    - /opt/postgres
    - "{{ pg_data_dir }}"
    - "{{ pg_custom_dir }}"

- name: 下发 Postgres Docker Compose 文件
  template:
    src: docker-compose.yml.j2
    dest: /opt/postgres/docker-compose.yml
    owner: root
    group: root
    mode: '0600'
  notify: Restart Postgres
  no_log: true

- name: 启动 Postgres 容器
  community.docker.docker_compose_v2:
    project_src: /opt/postgres
    state: present



- name: 创建备份目录
  file:
    path: /opt/postgres_backups  # 👈 修改这里：放到同级目录
    state: directory
    mode: '0700'

- name: 下发全库备份脚本
  template:
    src: pg_backup_all.sh.j2
    dest: "{{ postgres_backup_script_path }}"
    owner: root
    group: root
    mode: '0700'
  no_log: true

- name: 移除旧的 PostgreSQL root crontab 备份任务
  ansible.builtin.cron:
    name: "Postgres Full Instance Backup"
    state: absent

- name: 设置定时任务 (每天两次全量备份 - 03:00 和 15:00)
  ansible.builtin.cron:
    name: "Postgres Full Instance Backup"
    cron_file: "{{ postgres_backup_cron_file }}"
    user: root
    minute: "{{ postgres_backup_cron_minute }}"
    hour: "{{ postgres_backup_cron_hour }}"
    job: "{{ postgres_backup_script_path }} >> {{ postgres_backup_log_file }} 2>&1"

- name: 配置 PostgreSQL 备份日志轮转
  copy:
    dest: /etc/logrotate.d/pg_backup
    content: |
      {{ postgres_backup_log_file }} {
          daily
          rotate 7
          missingok
          notifempty
          compress
          delaycompress
          copytruncate
      }
