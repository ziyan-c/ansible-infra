---
# ==========================================
# 1. 安装 Docker 及其组件
# ==========================================
- name: 安装 Docker.io 和 Python Docker 绑定
  apt:
    name:
      - docker.io
      - python3-docker     # 👈 确保 Ansible 能操控 Docker
    state: present
    update_cache: yes

- name: 检查 Docker Compose v2 插件是否可用
  command: docker compose version
  register: docker_compose_v2_check
  changed_when: false
  failed_when: false

- name: 安装 Docker Compose v2 插件候选包
  apt:
    name: "{{ item }}"
    state: present
  loop:
    - docker-compose-plugin
    - docker-compose-v2
  register: docker_compose_v2_package_attempts
  failed_when: false
  when: docker_compose_v2_check.rc != 0

- name: 再次检查 Docker Compose v2 插件
  command: docker compose version
  register: docker_compose_v2_verify
  changed_when: false
  failed_when: docker_compose_v2_verify.rc != 0
  when: docker_compose_v2_check.rc != 0

# ==========================================
# 2. 配置 Docker 全局日志限制
# ==========================================
- name: 确保 /etc/docker 目录存在
  file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: 下发 Docker 守护进程配置文件 (daemon.json)
  template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: '0644'
  notify: Restart Docker

# ==========================================
# 3. 服务管理
# ==========================================
- name: 确保 Docker 服务已启动并设置开机自启
  systemd:
    name: docker
    state: started
    enabled: yes

- name: 确保 Docker 能够通过 Systemd 重载配置
  systemd:
    daemon_reload: yes


- name: 创建全局公共网关网络 (web-proxy)
  community.docker.docker_network:
    name: web-proxy
    driver: bridge
    state: present
