---
- name: Render shell templates for static checks
  hosts: vps-a.example.com
  gather_facts: false
  connection: local
  vars_files:
    - ../.local.example/role_vars/certbot/main.yml
    - ../.local.example/role_vars/logto/main.yml
    - ../.local.example/role_vars/mailcow/main.yml
    - ../.local.example/role_vars/postgres/main.yml
    - ../.local.example/role_vars/sftpgo/main.yml
    - ../.local.example/role_vars/zammad/main.yml
  vars:
    render_dir: "{{ lookup('env', 'TEST_RENDER_DIR') }}"
    repo_root: "{{ playbook_dir }}/.."
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    sftpgo_config_dir: /opt/sftpgo/config
    sftpgo_backup_root: /opt/sftpgo_backups
    sftpgo_backup_keep_local: 7
    sftpgo_backup_keep_remote: 14
    shell_templates:
      - src: "{{ repo_root }}/roles/gateway/caddy/templates/caddy_backup.sh.j2"
        dest: caddy_backup.sh
      - src: "{{ repo_root }}/roles/gateway/certbot/templates/sync_certs.sh.j2"
        dest: sync_certs.sh
      - src: "{{ repo_root }}/roles/apps/mailcow/templates/mailcow_backup.sh.j2"
        dest: mailcow_backup.sh
      - src: "{{ repo_root }}/roles/apps/postgres/templates/pg_backup_all.sh.j2"
        dest: pg_backup_all.sh
      - src: "{{ repo_root }}/roles/apps/logto/templates/logto_retention_cleanup.sh.j2"
        dest: logto_retention_cleanup.sh
      - src: "{{ repo_root }}/roles/apps/sftpgo/templates/sftpgo_retention_cleanup.sh.j2"
        dest: sftpgo_retention_cleanup.sh
      - src: "{{ repo_root }}/roles/apps/sftpgo/templates/sftpgo_backup.sh.j2"
        dest: sftpgo_backup.sh
      - src: "{{ repo_root }}/roles/apps/zammad/templates/zammad_sync.sh.j2"
        dest: zammad_sync.sh
      - src: "{{ repo_root }}/roles/apps/zammad/templates/zammad_backup_config.j2"
        dest: zammad_backup_config
  tasks:
    - name: Ensure TEST_RENDER_DIR was provided
      ansible.builtin.assert:
        that:
          - render_dir | length > 0

    - name: Create render directory
      ansible.builtin.file:
        path: "{{ render_dir }}"
        state: directory
        mode: "0700"

    - name: Render shell templates
      ansible.builtin.template:
        src: "{{ item.src }}"
        dest: "{{ render_dir }}/{{ item.dest }}"
        mode: "0700"
      loop: "{{ shell_templates }}"
