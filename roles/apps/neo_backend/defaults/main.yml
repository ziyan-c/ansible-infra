---
neo_backend_project_dir: /opt/neo_backend
neo_backend_owner: root
neo_backend_group: root
neo_backend_enabled: "{{ enable_neo_backend_routes | default(false) }}"
neo_backend_manage_runtime: true
neo_backend_image: "neo-backend:local"
neo_backend_container_name: neo-backend
neo_backend_publish_wireguard: true
neo_backend_wireguard_bind_ip: ""

neo_proxy_password: ""
neo_proxy_password_allow_empty: false
neo_bind_host: "0.0.0.0"
neo_rag_proxy_port: 8000
neo_llm_proxy_port: 8080

neo_local_rag_port: 18000
neo_local_llm_port: 18080
neo_rag_base_url: "http://127.0.0.1:{{ neo_local_rag_port }}"
neo_llm_base_url: "http://127.0.0.1:{{ neo_local_llm_port }}"

neo_manage_ssh_tunnel: true
neo_ssh_user: root
neo_ssh_host: ""
neo_ssh_port: 22
ssh_tunnel_password: ""
neo_ssh_key_path: ""
neo_ssh_bind_host: "127.0.0.1"
neo_remote_rag_host: localhost
neo_remote_rag_port: 8000
neo_remote_llm_host: localhost
neo_remote_llm_port: 8080

neo_upstream_timeout_seconds: 300
neo_log_tunnel_command: false
