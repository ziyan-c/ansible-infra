---
- name: 创建 Zammad 工作目录
  file:
    path: /opt/zammad
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: 确保外部网络 web-proxy 存在
  community.docker.docker_network:
    name: web-proxy
    state: present

- name: 下发 Zammad 环境变量 (.env)
  template:  # 👈 改成 template
    src: "{{ playbook_dir }}/.local/zammad.env.j2"
    dest: /opt/zammad/.env
    owner: root
    group: root
    mode: '0600'
  register: zammad_env_template
  notify: Restart Zammad
  no_log: true

- name: 下发 Zammad Docker Compose 文件
  template:  # 👈 这里由 copy 改成 template
    src: docker-compose.yml.j2
    dest: /opt/zammad/docker-compose.yml
    owner: root
    group: root
    mode: '0644'
  register: zammad_compose_template
  notify: Restart Zammad

# 第一次启动 Zammad 会非常慢，因为 init 容器需要跑数据库迁移
- name: 启动 Zammad 基础依赖服务
  community.docker.docker_compose_v2:
    project_src: /opt/zammad
    state: present
    pull: missing
    services:
      - zammad-elasticsearch
      - zammad-memcached
      - zammad-postgresql
      - zammad-redis

- name: 等待 Zammad PostgreSQL 就绪
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - -T
      - zammad-postgresql
      - sh
      - -lc
      - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
  args:
    chdir: /opt/zammad
  register: zammad_postgres_ready
  until: zammad_postgres_ready.rc == 0
  retries: 30
  delay: 5
  changed_when: false

- name: 查询 Zammad 数据库是否已初始化
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - -T
      - zammad-postgresql
      - sh
      - -lc
      - psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select case when to_regclass('public.settings') is null then 'absent' else 'present' end;"
  args:
    chdir: /opt/zammad
  register: zammad_db_schema
  changed_when: false
  failed_when: false

- name: 执行 Zammad 初始化/迁移容器
  ansible.builtin.command: docker compose run --rm -T zammad-init
  args:
    chdir: /opt/zammad
  register: zammad_init_run
  changed_when: true
  when:
    - >
      zammad_db_schema.rc != 0 or
      'present' not in (zammad_db_schema.stdout_lines | default([])) or
      (zammad_env_template.changed | default(false) | bool) or
      (zammad_compose_template.changed | default(false) | bool)

- name: 启动 Zammad 容器栈
  community.docker.docker_compose_v2:
    project_src: /opt/zammad
    state: present
    pull: missing
    services:
      - zammad-backup
      - zammad-elasticsearch
      - zammad-memcached
      - zammad-nginx
      - zammad-postgresql
      - zammad-railsserver
      - zammad-redis
      - zammad-scheduler
      - zammad-websocket


# ==========================================
# 👇 新增：自动化配置 Zammad 存储引擎为 File
# ==========================================
- name: 等待 Zammad Rails 服务彻底启动就绪 (首次部署需等待数据库 Migration)
  ansible.builtin.command: docker compose exec -T zammad-railsserver /opt/zammad/bin/rails r "puts 'Ready'"
  args:
    chdir: /opt/zammad
  register: zammad_ready
  until: zammad_ready.rc == 0
  retries: 60       # 尝试 60 次
  delay: 15         # 每次间隔 15 秒 (总共愿意等 15 分钟)
  changed_when: false
  ignore_errors: no

- name: 查询 Zammad 附件存储状态
  ansible.builtin.command: >
    docker compose exec -T zammad-railsserver /opt/zammad/bin/rails r
    "puts '__ANSIBLE_ZAMMAD_STORAGE_PROVIDER__=' + Setting.get('storage_provider').to_s;
    puts(Store::File.where(provider: 'DB').exists? ? '__ANSIBLE_ZAMMAD_DB_STORE__=present' : '__ANSIBLE_ZAMMAD_DB_STORE__=absent')"
  args:
    chdir: /opt/zammad
  register: zammad_storage_status
  changed_when: false
  when: zammad_ready.rc == 0

- name: 将 Zammad 附件存储模式改为 File System，并迁移存量数据
  ansible.builtin.shell: |
    docker compose exec -T zammad-railsserver /opt/zammad/bin/rails r "
    Setting.set('storage_provider', 'File');
    Store::File.move('DB', 'File') if Store::File.where(provider: 'DB').exists?
    "
  args:
    chdir: /opt/zammad
  register: zammad_storage_fix
  changed_when: true
  when:
    - zammad_ready.rc == 0
    - >
      '__ANSIBLE_ZAMMAD_STORAGE_PROVIDER__=File' not in (zammad_storage_status.stdout_lines | default([])) or
      '__ANSIBLE_ZAMMAD_DB_STORE__=present' in (zammad_storage_status.stdout_lines | default([]))

- name: 打印存储修改结果
  debug:
    msg: >-
      {{
        'Zammad 存储模式已调整为 File，并完成必要迁移。'
        if zammad_storage_fix is changed
        else 'Zammad 存储模式已是 File，无需迁移。'
      }}
  when: zammad_ready.rc == 0
# ==========================================
# 👆 新增结束
# ==========================================


# ==========================================
# 自动化备份：解耦本地备份与云端同步
# ==========================================
- name: 下发 Zammad 解耦版备份脚本
  template:
    src: zammad_sync.sh.j2
    dest: /opt/zammad/zammad_sync.sh
    owner: root
    group: root
    mode: '0700'

- name: 确保 Zammad 备份日志文件存在且权限收敛
  ansible.builtin.file:
    path: "{{ item }}"
    state: touch
    owner: root
    group: root
    mode: '0640'
    access_time: preserve
    modification_time: preserve
  loop:
    - /var/log/zammad_backup_local.log
    - /var/log/zammad_backup_cloud.log

- name: 设置定时任务 (每天早 06:00 触发 Zammad 本地备份)
  ansible.builtin.cron:
    name: "Zammad Local Backup"
    minute: "0"
    hour: "6"
    job: "/opt/zammad/zammad_sync.sh local >> /var/log/zammad_backup_local.log 2>&1"

- name: 设置定时任务 (每天晚 18:00 触发 Zammad 云端同步)
  ansible.builtin.cron:
    name: "Zammad Cloud Sync"
    minute: "0"
    hour: "18"
    job: "/opt/zammad/zammad_sync.sh cloud >> /var/log/zammad_backup_cloud.log 2>&1"

- name: 配置 Zammad 备份日志轮转 (包含两个日志)
  ansible.builtin.copy:
    dest: /etc/logrotate.d/zammad_sync
    owner: root
    group: root
    mode: '0644'
    content: |
      /var/log/zammad_backup_local.log
      /var/log/zammad_backup_cloud.log {
          daily
          rotate 7
          missingok
          notifempty
          compress
          delaycompress
          create 0640 root root
      }
