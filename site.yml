---
# ==========================================
# 第一阶段：基础架构层 (Base)
# ==========================================
- name: 初始化所有服务器基础环境
  hosts: init_nodes
  become: yes
  gather_facts: yes  # 👈 必须为 yes，否则拿不到网卡名
  pre_tasks: &load_role_vars
    - name: Load project-local role variables
      ansible.builtin.include_vars:
        dir: "{{ ansible_local_role_vars_dir }}"
        extensions:
          - yml
          - yaml
        ignore_unknown_extensions: true
      no_log: true
      tags:
        - always
  roles:
    - role: base/system_init
      tags: ['init', 'base']

    - role: base/docker_setup
      tags: ['docker', 'base']

- name: 组建 WireGuard 全互联大内网
  hosts: vpn_mesh_nodes
  become: yes
  gather_facts: yes  # 👈 必须加上！防止单独跑 tags 时网卡变量未定义！
  pre_tasks: *load_role_vars
  roles:
    - role: base/vpn_wireguard
      tags: ['vpn', 'wireguard', 'wg-restricted', 'base']

- name: 建立 WireGuard 受限被管理网
  hosts: vpn_mesh_nodes
  become: yes
  gather_facts: yes
  pre_tasks: *load_role_vars
  roles:
    - role: base/wg_restricted
      tags: ['vpn', 'wireguard', 'wg-restricted', 'base']
      when: wg_restricted_enabled | default(false) | bool

# ==========================================
# 第二阶段：网关与代理层 (Gateway & Proxy)
# ==========================================
- name: 部署泛域名证书中枢 (仅限主节点执行)
  hosts: cert_master_nodes   # 👈 完美解耦，只针对负责证书的组
  become: yes
  pre_tasks: *load_role_vars
  roles:
    - role: gateway/certbot
      tags: ['certbot', 'gateway']

- name: 部署分布式 Web 网关 (Caddy)
  hosts: gateway_nodes       # 👈 所有网关节点并发执行
  become: yes
  pre_tasks: *load_role_vars
  roles:
    - role: gateway/caddy
      tags: ['caddy', 'gateway']


# ==========================================
# 第三阶段：业务应用层 (Apps)
# ==========================================
- name: 部署 Xray under Caddy 保险节点
  hosts: xray_under_caddy_nodes
  become: yes
  pre_tasks: *load_role_vars
  roles:
    - role: apps/xray_under_caddy
      tags: ['xray-under-caddy', 'apps']

- name: 部署 Xray Reality 主力节点
  hosts: xray_nodes
  become: yes
  pre_tasks: *load_role_vars
  roles:
    - role: apps/xray
      tags: ['xray', 'apps']

- name: 部署 AI 向量数据库
  hosts: db_postgres_nodes  # 👈 修复：直接使用 inventory 中定义好的组名
  become: yes
  pre_tasks: *load_role_vars
  roles:
    - role: apps/postgres
      tags: ['db', 'postgres', 'apps']

- name: 部署 Logto IAM 身份中心
  hosts: logto_nodes
  become: yes
  pre_tasks: *load_role_vars
  roles:
    - role: apps/logto
      tags: ['logto', 'iam', 'apps']
      when: logto_enabled | default(false) | bool

- name: 部署 SFTPGo 文件门户
  hosts: sftpgo_nodes
  become: yes
  pre_tasks: *load_role_vars
  roles:
    - role: apps/sftpgo
      tags: ['sftpgo', 'files', 'apps']
      when: sftpgo_enabled | default(false) | bool

- name: 部署企业级邮局 Mailcow
  hosts: mail_nodes         # 👈 修复：直接使用 inventory 中定义好的组名
  become: yes
  pre_tasks: *load_role_vars
  roles:
    - role: apps/mailcow
      tags: ['mailcow', 'apps']

- name: 部署 Zammad 工单系统
  hosts: zammad_nodes       # 👈 修复：直接使用 inventory 中定义好的组名
  become: yes
  pre_tasks: *load_role_vars
  roles:
    - role: apps/zammad
      tags: ['zammad', 'apps']
      when: zammad_enabled | default(true) | bool

- name: 部署 Cloudflare Tunnel 接入点
  hosts: tunnel_nodes
  become: yes
  pre_tasks: *load_role_vars
  roles:
    - role: apps/cloudflared
      tags: ['cloudflared', 'tunnel', 'apps']

- name: 部署 Proxy Control Plane 控制面
  hosts: proxy_control_plane_nodes
  become: yes
  pre_tasks: *load_role_vars
  roles:
    - role: apps/proxy_control_plane
      tags: ['proxy-control-plane', 'control-plane', 'apps']
      when: proxy_control_plane_enabled | default(false) | bool


# ==========================================
# 第四阶段：控制面登记 (Control Plane Registration)
# ==========================================
- name: 同步代理节点目录到控制面
  hosts: proxy_control_plane_sync_nodes
  become: no
  gather_facts: false
  pre_tasks: *load_role_vars
  roles:
    - role: apps/proxy_control_plane_node_sync
      tags: ['control-plane', 'node-sync', 'apps']
      when: proxy_control_plane_node_sync_enabled | default(false) | bool
