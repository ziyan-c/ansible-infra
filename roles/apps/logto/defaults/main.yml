---
logto_enabled: false
logto_image: "ghcr.io/logto-io/logto:1.40.1"
logto_project_dir: /opt/logto
logto_owner: root
logto_group: root
logto_manage_runtime: true
logto_container_name: logto

logto_bind_host: "127.0.0.1"
logto_core_port: 3001
logto_admin_port: 3002
logto_domain: auth.example.com
logto_admin_domain: ""
logto_endpoint: "https://{{ logto_domain }}"
logto_admin_endpoint: "{{ ('https://' ~ logto_admin_domain) if (logto_admin_domain | default('') | length > 0) else ('http://' ~ logto_bind_host ~ ':' ~ (logto_admin_port | string)) }}"
logto_trust_proxy_header: true
logto_database_statement_timeout: ""

logto_db_host: >-
  {{ wg_network_prefix }}.{{ (wg_servers.values() | selectattr('hostname', 'equalto', deploy_node_postgres) | first).ip_suffix }}
logto_db_port: 5432
logto_db_name: logto
logto_db_user: logto
logto_db_password: ""
logto_postgres_admin_user: "{{ pg_user | default('postgres') }}"
logto_postgres_delegate_host: "{{ deploy_node_postgres | default(inventory_hostname) }}"

logto_secret_vault_kek: ""
logto_run_connector_init: true
logto_run_seed: true
logto_run_alteration: true

logto_retention_enabled: true
logto_retention_project_dir: "{{ logto_project_dir }}/retention"
logto_retention_script_path: "{{ logto_retention_project_dir }}/logto_retention_cleanup.sh"
logto_retention_log_file: /var/log/logto_retention_cleanup.log
logto_retention_cron_file: logto_retention_cleanup
logto_retention_cron_hour: "3"
logto_retention_cron_minute: "55"
logto_audit_log_retention_days: 90
logto_service_log_retention_days: 90
logto_expired_transient_grace_days: 7
logto_passcode_retention_days: 7
logto_sentinel_activity_retention_days: 30
logto_retention_logrotate_keep: 14
