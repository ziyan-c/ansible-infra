---
proxy_control_plane_enabled: false
proxy_control_plane_image: "ghcr.io/ziyan-c/proxy-control-plane:0.2"
proxy_control_plane_bind_host: "127.0.0.1"
proxy_control_plane_host_port: 9710
proxy_control_plane_env_file_src: "{{ ansible_local_role_vars_dir }}/apps/proxy_control_plane/app.env"

proxy_control_plane_node_sync_enabled: false
proxy_control_plane_api_url: "http://127.0.0.1:9710"
proxy_control_plane_admin_email: "admin@example.com"
proxy_control_plane_admin_password: "REPLACE_ME_PROXY_CONTROL_PLANE_ADMIN_PASSWORD"
proxy_control_plane_access_token: ""
proxy_control_plane_default_region: ""
proxy_control_plane_validate_certs: true

proxy_control_plane_runtime_api_enabled: false
proxy_control_plane_runtime_api_host: ""
proxy_control_plane_runtime_api_tag: proxy-control-plane-api
proxy_control_plane_runtime_inbound_tag: proxy-control-plane-vless-in
proxy_control_plane_xray_runtime_api_port: 10085
proxy_control_plane_xray_under_caddy_runtime_api_port: 10085

proxy_control_plane_subscription_proxy_enabled: false
proxy_control_plane_subscription_proxy_upstream: "http://127.0.0.1:9710"
proxy_control_plane_subscription_public_path: /xray/sub
