---
- name: Verify
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    v2ray_project_dir: "{{ lookup('env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/v2ray"
  tasks:
    - name: Check rendered V2ray config exists
      ansible.builtin.stat:
        path: "{{ v2ray_project_dir }}/config.json"
      register: v2ray_config

    - name: Check rendered compose file exists
      ansible.builtin.stat:
        path: "{{ v2ray_project_dir }}/docker-compose.yml"
      register: v2ray_compose

    - name: Assert rendered files exist
      ansible.builtin.assert:
        that:
          - v2ray_config.stat.exists
          - v2ray_compose.stat.exists

    - name: Validate rendered V2ray config JSON
      ansible.builtin.command:
        cmd: "jq -e . {{ v2ray_project_dir }}/config.json"
      changed_when: false

    - name: Validate rendered compose file
      ansible.builtin.command:
        cmd: "docker compose -f {{ v2ray_project_dir }}/docker-compose.yml config"
      changed_when: false
