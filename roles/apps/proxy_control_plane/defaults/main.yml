---
proxy_control_plane_enabled: false
proxy_control_plane_image: "ghcr.io/ziyan-c/proxy-control-plane:0.2"
proxy_control_plane_project_dir: /opt/proxy-control-plane
proxy_control_plane_owner: root
proxy_control_plane_group: root
proxy_control_plane_manage_runtime: true
proxy_control_plane_container_name: proxy-control-plane_api
proxy_control_plane_bind_host: "127.0.0.1"
proxy_control_plane_host_port: 9710
proxy_control_plane_container_port: 9710
proxy_control_plane_env_file_src: ""
proxy_control_plane_env_file_dest: "{{ proxy_control_plane_project_dir }}/app.env"
proxy_control_plane_run_migrations: true

proxy_control_plane_ghcr_username: ""
proxy_control_plane_ghcr_token: ""
